name: Release

on:
  push:
    tags:
      - v*

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: 0

jobs:

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        filter: tree:0
      timeout-minutes: 2

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true

    - name: Run unit tests
      run: go test -timeout 25m ./pkg/... ./cmd/...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        filter: tree:0
      timeout-minutes: 2

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true

    - name: govulncheck (known Go vulnerabilities reachable from code)
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # webui/ and docs/ hold build-time tooling that never ships in the image.
    - name: Trivy scan (Go dependencies)
      run: |
        docker run --rm -v "$PWD":/repo aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs \
          --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
          --skip-dirs /repo/webui --skip-dirs /repo/docs \
          --exit-code 1 /repo

  push:
    runs-on: ubuntu-latest
    needs: [test-unit, security]
    permissions:
          contents: read
          packages: write
    timeout-minutes: 45
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        filter: tree:0
      timeout-minutes: 2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      timeout-minutes: 2

    - name: Setup QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      timeout-minutes: 2

    - name: Setup docker buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        driver-opts: |
          image=moby/buildkit:master
          network=host
      timeout-minutes: 2

    # This step is needed to expose ACTIONS_CACHE_URL & ACTIONS_RUNTIME_TOKEN to
    # docker buildx so that it can cache build steps. 
    - name: Expose GitHub Runtime env vars
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      timeout-minutes: 2

    - name: Build docker image locally for scanning
      run: |
        make build-multi-arch-image DOCKER_BUILDX_ARGS=--load
      timeout-minutes: 20

    # The ignore policy filters CVEs reported against the traefik module
    # itself (fork builds carry no release version, so every traefik CVE
    # matches); those are handled by rebasing on upstream.
    - name: Trivy scan of the built image
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$PWD/.trivy":/policy aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
          --severity CRITICAL,HIGH --ignore-unfixed \
          --ignore-policy /policy/ignore-policy.rego \
          --exit-code 1 ghcr.io/artex-io/traefik:latest

    - name: Push docker image (latest + version tag)
      run: |
        make push-multi-arch-image
      timeout-minutes: 20
