name: Build Binaries

on:
  push:
    branches:
      - master-artex
      - master
      - v*
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'script/gcg/**'

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: 0

jobs:

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: tree:0
      timeout-minutes: 2

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true

    - name: Run unit tests
      run: go test -timeout 25m ./pkg/... ./cmd/...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: tree:0
      timeout-minutes: 2

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true

    - name: govulncheck (known Go vulnerabilities reachable from code)
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # webui/ and docs/ hold build-time tooling that never ships in the image.
    - name: Trivy scan (Go dependencies)
      run: |
        docker run --rm -v "$PWD":/repo aquasec/trivy:latest fs \
          --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
          --skip-dirs /repo/webui --skip-dirs /repo/docs \
          --exit-code 1 /repo

  build:
    runs-on: ubuntu-latest
    needs: [test-unit, security]
    timeout-minutes: 20
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: tree:0
      timeout-minutes: 2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      timeout-minutes: 2

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      timeout-minutes: 2

    - name: Setup docker buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:master
          network=host
      timeout-minutes: 2

    # This step is needed to expose ACTIONS_CACHE_URL & ACTIONS_RUNTIME_TOKEN to
    # docker buildx so that it can cache build steps. 
    - name: Expose GitHub Runtime env vars
      uses: crazy-max/ghaction-github-runtime@v3
      timeout-minutes: 2

    - name: Build and push docker image
      run: |
        make build-multi-arch-image
      timeout-minutes: 20
